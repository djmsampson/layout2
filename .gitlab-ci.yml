historic-tests:
  stage: test
  parallel:
    matrix:
      - MATLAB_RELEASE: ["R2018b", "R2020b", "R2022b", "R2024b"]
  rules:
    - if: $CI_PIPELINE_SOURCE == 'web'
      when: always
    - if: $CI_COMMIT_TAG =~ /^v\d.*/
      when: always
  tags:
   - long-jobs
  script:    
    - mw -using ${MATLAB_RELEASE}:perfect matlab -batch "addpath('tests'); results = runToolboxTests(); assert(~any([results.Failed]))"
  artifacts:
    when: always
    paths:
      - TestResults.xml
    reports:
      junit: TestResults.xml

jsd-test:
  stage: test
  parallel:
    matrix:
      - MATLAB_RELEASE: ["R2025a"]
  tags:
    - long-jobs
  script:    
    - mw -using ${MATLAB_RELEASE}:perfect matlab -batch "openProject('project.prj'); assertSuccess(runToolboxTests());"
  artifacts:
    when: always
    paths:
      - TestResults.xml
    reports:
      junit: TestResults.xml